<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Abroad</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f3ee;
      color: #1f2328;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #15171a; color: #e8e6e3; }
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 8px; }
    p { margin: 0; opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <h1>Spring Abroad</h1>
    <p>Our planning site is on its way.</p>
  </main>
</body>
</html>
