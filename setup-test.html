<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connection Test</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f3ee;
      color: #1f2328;
      padding: 24px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #15171a; color: #e8e6e3; }
    }
    h1 { font-size: 1.6rem; margin: 0 0 12px; }
    #status { font-size: 1.1rem; }
    #detail { margin-top: 10px; opacity: 0.7; font-size: 0.95rem; max-width: 40ch; }
    .ok { color: #1a7f37; }
    .bad { color: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .ok { color: #3fb950; }
      .bad { color: #ff7b72; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Database connection test</h1>
    <div id="status" data-result="pending">Testing…</div>
    <div id="detail"></div>
  </main>
  <script type="module">
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");

    function show(ok, text, more) {
      status.textContent = text;
      status.className = ok ? "ok" : "bad";
      status.dataset.result = ok ? "ok" : "error";
      detail.textContent = more || "";
    }

    try {
      const { db } = await import("./js/firebase.js");
      const { doc, setDoc, getDoc, deleteDoc, serverTimestamp } =
        await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");

      const ref = doc(db, "_setup_test", "check-" + Date.now());
      await setDoc(ref, { note: "connection test", at: serverTimestamp() });
      const snap = await getDoc(ref);
      if (!snap.exists()) throw new Error("Saved an entry but couldn't read it back.");
      await deleteDoc(ref);

      show(true, "✓ Connected", "Saved a test entry, read it back, and cleaned it up. The site can store your group's entries.");
    } catch (err) {
      const code = err && err.code ? err.code : "";
      if (code === "permission-denied") {
        show(false, "✗ Blocked by database rules",
          "Firebase refused the save. The rules in Firestore → Rules probably weren't published yet.");
      } else {
        show(false, "✗ Couldn't connect", (code ? code + ": " : "") + (err && err.message ? err.message : String(err)));
      }
    }
  </script>
</body>
</html>
