<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One-time update</title>
  <style>body{font-family:system-ui,sans-serif;padding:24px;line-height:1.6}</style>
</head>
<body>
  <h1>One-time update</h1>
  <p id="out">Updating saved plans…</p>
  <ul id="log"></ul>
  <script type="module">
    // Gives the starting trips and notes real dates. Running it again changes nothing new.
    import { db } from "./js/firebase.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const changes = [
      ["trips", "start-london", { arrive: "2027-02-26", depart: "2027-02-28" }],
      ["trips", "start-dublin", { arrive: "2027-03-11", depart: "2027-03-14" }],
      ["notes", "start-alex-bday", { date: "2027-01-07" }],
      ["notes", "start-valentines", { date: "2027-02-14" }],
      ["notes", "start-presidents", { date: "2027-02-15", text: "Presidents' Day" }],
      ["notes", "start-casey-bday", { date: "2027-02-17" }],
      ["notes", "start-easter", { date: "2027-03-28" }],
      ["notes", "start-julia-bday", { date: "2027-04-14" }],
      ["notes", "start-spring-break-1", { deleted: true }],
      ["notes", "start-spring-break-2", { deleted: true }],
    ];

    const log = document.getElementById("log");
    const out = document.getElementById("out");
    try {
      for (const [col, id, data] of changes) {
        const ref = doc(db, col, id);
        const snap = await getDoc(ref);
        if (!snap.exists()) { log.insertAdjacentHTML("beforeend", `<li>Not found: ${id}</li>`); continue; }
        await updateDoc(ref, { ...data, updatedAt: serverTimestamp() });
        log.insertAdjacentHTML("beforeend", `<li>Updated: ${id}</li>`);
      }
      out.textContent = "Done.";
    } catch (err) {
      out.textContent = "Failed: " + (err.code || "") + " " + err.message;
    }
  </script>
</body>
</html>
